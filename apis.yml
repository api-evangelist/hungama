name: Hungama
description: 'Hungama (Hungama Digital Media Entertainment Pvt. Ltd.) is an Indian digital
  entertainment company operating a video-on-demand and audio OTT platform. Hungama.com
  offers trending web series, popular movies, Hungama Originals, music, podcasts, audiobooks,
  and audio stories across Hindi, Bollywood, Punjabi, and regional Indian content. The
  company was surfaced as a portfolio company of Bessemer Venture Partners and added to
  the API Evangelist network. Hungama publishes a public LLM Access Policy (llms.txt)
  governing how AI systems may crawl, summarize, and reference its content, but exposes
  no public developer API or documentation.'
